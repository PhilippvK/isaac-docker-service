---
filter:
  sets:
    drop: []
  instructions:
    drop: []
  opcodes:
    keep:
    - custom-0
    - custom-1
    - custom-2
    - custom-3
    - OP-V
    - OP-P
    - reserved
  encoding_sizes:
    keep:
    - 3
git:
  author: ISAAC Developers
  mail: example@example.com
llvm:
  ninja: true
  default_config: release
  state:
    version:
      major: 19
  configs:
    release:
      options:
        CMAKE_BUILD_TYPE: Release
        LLVM_BUILD_TOOLS: true
        LLVM_ENABLE_ASSERTIONS: false
        LLVM_OPTIMIZED_TABLEGEN: true
        LLVM_ENABLE_PROJECTS: [clang, lld]
        LLVM_TARGETS_TO_BUILD: [X86, RISCV]
        LLVM_USE_RELATIVE_PATHS_IN_DEBUG_INFO: true  # for ccache
        CMAKE_INSTALL_DO_STRIP: true
        # LLVM_BUILD_LLVM_DYLIB: true
        # LLVM_LINK_LLVM_DYLIB: true
        LLVM_BUILD_LLVM_DYLIB: false
        LLVM_LINK_LLVM_DYLIB: false
        # LLVM_BUILD_STATIC_LIBS: false
        LLVM_INCLUDE_TESTS: false
        LLVM_INCLUDE_BENCHMARKS: false
        LLVM_INCLUDE_DOCS: false
        LLVM_BUILD_TESTS: false
        LLVM_INCLUDE_EXAMPLES: false
        LLVM_BUILD_DOCS: false
        # LLVM_BUILD_RUNTIME: false
    release_assertions:
      options:
        CMAKE_BUILD_TYPE: Release
        LLVM_BUILD_TOOLS: true
        LLVM_ENABLE_ASSERTIONS: true
        LLVM_OPTIMIZED_TABLEGEN: true
        LLVM_ENABLE_PROJECTS: [clang, lld]
        LLVM_TARGETS_TO_BUILD: [X86, RISCV]
        LLVM_USE_RELATIVE_PATHS_IN_DEBUG_INFO: true  # for ccache
        CMAKE_INSTALL_DO_STRIP: true
    debug:
      options:
        CMAKE_BUILD_TYPE: Debug
        LLVM_BUILD_TOOLS: true
        LLVM_ENABLE_ASSERTIONS: true
        LLVM_OPTIMIZED_TABLEGEN: true
        LLVM_ENABLE_PROJECTS: [clang, lld]
        LLVM_TARGETS_TO_BUILD: [X86, RISCV]
        LLVM_PARALLEL_LINK_JOBS: 8
        # LLVM_USE_LINKER: lld
        LLVM_USE_RELATIVE_PATHS_IN_DEBUG_INFO: true  # for ccache
        CMAKE_INSTALL_DO_STRIP: true
patches:
  - name: gitignore
    target: llvm
    stage: 0
    comment: ""
    file: llvm/gitignore.patch
  - name: gitlab_ci
    target: llvm
    stage: 0
    comment: "[CI] Add CI/CD-Configuration for GitLab"
    file: llvm/gitlab_ci.patch
    # Alternatives (automated lookup not yet implemented):
    # file: gitlab_ci.patch
    # file: llvm/gitlab_ci.patch
    # file: /absolute/path/to/gitlab_ci.patch
  - name: insert_markers_llvm17
    onlyif: "settings.llvm.state.version.major == 17"
  - name: insert_markers_llvm18
    onlyif: "settings.llvm.state.version.major == 18"
  - name: insert_markers_llvm19
    onlyif: "settings.llvm.state.version.major == 19"
  - name: legalizer_split
  - name: uimm12_op
    onlyif: "settings.llvm.state.version.major == 18"
  - name: uimm12_op_llvm19
    onlyif: "settings.llvm.state.version.major == 19"
riscv:
  xlen: 32
  features:
  - m
  - fast-unaligned-access
tools:
  pattern_gen:
    integrated: true
    clone_depth: 1
    sparse_checkout: true  # broken on u20.04
