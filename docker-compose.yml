# version: "3.9"

services:

  redis:
    image: redis:7

  api:
    build: ./api
    ports:
      - "8080:8080"
    depends_on:
      - redis
    volumes:
      - jobs:/jobs

  worker:
    build: ./worker
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 8G
    depends_on:
      - redis
    volumes:
      - jobs:/jobs
      - ccache:/ccache
    environment:
      - REDIS_HOST=redis

volumes:
  jobs:
  ccache:
